<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#10B981" />
		<meta name="description" content="货殖 - 一个简洁纯粹的个人记账系统" />

		<!-- PWA manifest -->
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- 图标 -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- iOS PWA 增强：添加到主屏后的沉浸式体验 -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="货殖" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- 主题颜色切换（JS 注入，避免闪烁） -->
		<script>
			(function () {
				try {
					const stored = localStorage.getItem('hz_theme');
					let theme = stored || 'system';
					if (theme === 'system') {
						theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					if (theme === 'dark') {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {}

				// 界面字体大小：在首帧前改根字号，避免先默认后跳变
				try {
					const fsMap = { sm: '14px', md: '16px', lg: '18px', xl: '20px' };
					const fs = localStorage.getItem('hz_font_size');
					if (fs && fsMap[fs]) document.documentElement.style.fontSize = fsMap[fs];
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
