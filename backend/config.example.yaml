# ========== 服务配置 ==========
server:
  port: "8080"
  mode: "debug"          # debug / release
  read_timeout: 30       # 秒
  write_timeout: 30
  # 前端构建产物目录（SPA）。设置后由后端直接托管前端，无需 nginx；
  # 容器镜像已通过 HZ_STATIC_DIR=/app/static 默认启用，本地开发留空即可。
  # static_dir: "/app/static"

# ========== 数据库 ==========
# 选择驱动: sqlite 或 postgres
database:
  driver: "sqlite"
  # SQLite: 文件路径（容器内 WORKDIR 为 /app，相对路径落在 /app/data/ 下并随数据卷持久化）
  file: "./data/huozhi.db"
  # PostgreSQL: 连接参数（driver=postgres时启用）
  # host: "postgres"
  # port: "5432"
  # user: "huozhi"
  # password: "huozhi_pwd"
  # name: "huozhi"
  ssl_mode: "disable"

# ========== JWT ==========
jwt:
  secret: "please-change-this-secret-in-production"
  expire_hours: 168     # 7天
  issuer: "huozhi"

# ========== MCP（AI 助手接入） ==========
# 内置 MCP 服务端：接入后 AI 助手可用自然语言搜索 / 分析 / 增删改账单。
# 默认启用（本段缺失即为启用）；设为 true 关闭，端点不再注册。
# path 同时挂载 /mcp 与 /api/mcp 两个路径。环境变量：HZ_MCP_DISABLED / HZ_MCP_PATH
mcp:
  disabled: false
  # path: "/mcp"

# ========== 汇率（多币种折算） ==========
# 数据源均为**免密钥**公开接口，默认即可用；全部失败时回退到上次成功拉取的快照。
# disabled: true 用于完全离网部署（外币记账仍可手工填汇率，只是不再自动刷新）
# provider: auto（依次尝试 er-api → currency-api）/ er-api / currency-api
# symbols 留空则使用内置默认币种清单
# 环境变量：HZ_FX_DISABLED / HZ_FX_PROVIDER / HZ_FX_ENDPOINT / HZ_FX_DEFAULT_BASE
#          / HZ_FX_TIMEOUT_SECONDS / HZ_FX_REFRESH_HOURS / HZ_FX_SYMBOLS
fx:
  disabled: false
  provider: "auto"
  timeout_seconds: 10
  refresh_interval_hours: 12
  default_base: "CNY"
  # symbols: ["CNY", "USD", "EUR", "HKD", "JPY", "GBP", "SGD"]

# ========== 上传 ==========
# 容器部署时可用环境变量 HZ_UPLOAD_PATH 覆盖 path（Docker 镜像已默认指向 /app/data/uploads）
upload:
  path: "./data/uploads"
  max_size_mb: 10
  allowed: "jpg,jpeg,png,gif,webp,pdf,csv,xlsx"

backup:
  path: "./data/backups"

s3:
  enabled: false
  endpoint: ""
  region: "us-east-1"
  bucket: ""
  prefix: "huozhi"
  access_key: ""
  secret_key: ""
  use_ssl: true
  force_path_style: null
