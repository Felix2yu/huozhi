services:
  # ========= 单体版：SQLite 零依赖（最快体验） =========
  huozhi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huozhi
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      HZ_DB_DRIVER: "sqlite"
      HZ_DB_DSN: "/var/lib/huozhi/data/huozhi.db"
      # 如不设置，首次启动将自动生成持久化的随机密钥
      # HZ_JWT_SECRET: "please-change-this-strong-string"
    ports:
      - "80:80"
    volumes:
      - huozhi_data:/var/lib/huozhi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - huozhi-net

volumes:
  huozhi_data:
    name: huozhi_data

networks:
  huozhi-net:
    name: huozhi-net
