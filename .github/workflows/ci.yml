name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: backend
      test-packages: ./...
      web-dir: frontend
      web-install-flags: --legacy-peer-deps
      web-test-command: npm run test:coverage
      frontend-coverage-file: frontend/coverage/cobertura-coverage.xml

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: backend
      main-package: ./cmd/huozhi-server
      binary-name: huozhi-server
      image-name: ghcr.io/felix2yu/huozhi
      # 纯 Go SQLite 驱动（glebarez/sqlite），无需 CGO，静态编译即可
      cgo: off
      web-dir: frontend
      web-install-flags: --legacy-peer-deps
      frontend-stage-command: |
        mkdir -p dist
        cp -R frontend/build/. dist/

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: backend
      main-package: ./cmd/huozhi-server
      binary-name: huozhi-server
      cgo: off
      web-dir: frontend
      web-install-flags: --legacy-peer-deps
      frontend-stage-command: |
        mkdir -p dist
        cp -R frontend/build/. dist/
