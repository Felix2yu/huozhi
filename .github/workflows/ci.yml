name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: backend
      test-packages: ./...
      web-dir: frontend
      web-test-command: pnpm run test:coverage
      # internal/web 包带 //go:embed，产物缺失时包编译不过——
      # 先把前端产物摆到内嵌位置，再跑 go vet / go test
      frontend-stage-command: |
        mkdir -p backend/internal/web/dist
        cp -R frontend/build/. backend/internal/web/dist/
      frontend-coverage-file: frontend/coverage/cobertura-coverage.xml

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: backend
      main-package: ./cmd/huozhi-server
      binary-name: huozhi-server
      image-name: ghcr.io/felix2yu/huozhi
      # 纯 Go SQLite 驱动（glebarez/sqlite），无需 CGO，静态编译即可
      cgo: off
      web-dir: frontend
      # 产物摆到 go:embed 位置后由 go build 内嵌，镜像里不再 COPY 一份前端
      frontend-stage-command: |
        mkdir -p backend/internal/web/dist
        cp -R frontend/build/. backend/internal/web/dist/

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: backend
      main-package: ./cmd/huozhi-server
      binary-name: huozhi-server
      cgo: off
      web-dir: frontend
      frontend-stage-command: |
        mkdir -p backend/internal/web/dist
        cp -R frontend/build/. backend/internal/web/dist/
