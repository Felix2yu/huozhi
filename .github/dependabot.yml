# 由 Felix2yu/.github/preset/dependabot.yml 生成 —— 升级时整份覆盖
# 设计理由见 Felix2yu/.github/docs/dependabot.md

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    # 默认只有 5，达到上限后会「静默停止」提新 PR 且不报错
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    # 默认只有 5，达到上限后会「静默停止」提新 PR 且不报错
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    # 与 preset 同步：typescript 的 major 不提 PR。frontend 的 typescript@~6 是给
    # svelte-kit sync / svelte-check / typescript-eslint 用的 JS 编译器 API 宿主，
    # 直接换成 7 会让 CI 在 pnpm install 的 postinstall 崩（PR#102 的 test/test 就是这么红的）。
    # 本仓库只走 svelte-check 的默认路径：曾用过的 @typescript/native 别名 + --tsgo 已在
    # PR#105 撤除 —— 那条路因为解析不到 package.json imports 里的 #lib/*，类型程序是空的，
    # 注入硬错误也报 0 errors。理由与实测见 docs/dependabot.md 第六节
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    # 默认只有 5，达到上限后会「静默停止」提新 PR 且不报错
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "ci"

