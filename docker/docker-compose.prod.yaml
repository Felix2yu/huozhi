# 生产环境编排：前端+后端 + PostgreSQL 独立容器
services:
  # ====== PostgreSQL ======
  postgres:
    image: postgres:16-alpine
    container_name: huozhi-postgres
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: ${HZ_PG_USER:-huozhi}
      POSTGRES_PASSWORD: ${HZ_PG_PASS:-huozhi_please_change_me}
      POSTGRES_DB: ${HZ_PG_DB:-huozhi}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HZ_PG_USER:-huozhi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huozhi-net

  # ====== Huozhi (Nginx + Go 后端 + React SPA) ======
  huozhi:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: huozhi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: "Asia/Shanghai"
      HZ_DB_DRIVER: "postgres"
      HZ_PG_HOST: "postgres"
      HZ_PG_PORT: "5432"
      HZ_PG_USER: ${HZ_PG_USER:-huozhi}
      HZ_PG_PASS: ${HZ_PG_PASS:-huozhi_please_change_me}
      HZ_PG_DB:   ${HZ_PG_DB:-huozhi}
      HZ_JWT_SECRET: ${HZ_JWT_SECRET:?HZ_JWT_SECRET 必须设置}
    ports:
      - "80:80"
    volumes:
      - huozhi_data:/var/lib/huozhi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - huozhi-net

volumes:
  huozhi_data:
    name: huozhi_data
  pg_data:
    name: huozhi_pg_data

networks:
  huozhi-net:
    name: huozhi-net
